name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # `prisma generate` (postinstall del package.json) corre automáticamente
    # como parte de `pnpm install`, y prisma.config.ts requiere que
    # DIRECT_URL exista para resolver — no necesita conectarse de verdad, así
    # que un placeholder alcanza. Va a nivel de job para que esté disponible
    # ni bien arranca `pnpm install`, no solo en un step posterior.
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
      DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
      # Coincide con wrangler.jsonc — por si algo se evalúa en build time
      # (sitemap/robots ya son force-dynamic, pero esto es la red de
      # seguridad si algo más lo necesita más adelante).
      SITE_URL: "https://consorciodely-web.angel-xp-pb.workers.dev"
      MEDIA_PUBLIC_BASE_URL: "https://pub-60c7934288ac452ba86f88d86190298e.r2.dev"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Next.js build
        run: pnpm run build

      # Valida que el bundle para Cloudflare Workers compile. En Windows
      # local esto falla (ver commits) — corre limpio en Linux.
      - name: Cloudflare Workers build
        run: pnpm exec opennextjs-cloudflare build

      - name: Check Cloudflare deploy secrets
        id: check
        run: echo "ready=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"

      # Deploy real: solo en push a main, y solo cuando ya están configurados
      # los secrets de Cloudflare (Settings -> Secrets and variables ->
      # Actions) y wrangler.jsonc tiene el ID real del Hyperdrive/R2 (ver
      # README, sección "Deploy a Cloudflare").
      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.check.outputs.ready == 'true'
        run: pnpm exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy skipped (secrets not configured yet)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.check.outputs.ready != 'true'
        run: echo "::warning::Deploy omitido — faltan CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID en los secrets del repo. El build sí se validó correctamente."
